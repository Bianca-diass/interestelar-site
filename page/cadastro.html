<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/cadastro/cadastre-se.css">
    <link rel="stylesheet" href="../css/cadastro/cadastro.css">

    <script type="module" src="../javaScript/cadastro.js"></script>

    <title>Cadastro | Interestelar</title>
</head>
<body>
    <main class="container">
        <form id="cadastroForm" class="formulario">
            <h1>Cadastro</h1>

            <div class="input-cadastro">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="input-cadastro">
                <label for="emailCadastro">E-mail</label>
                <input
                    type="email"
                    id="emailCadastro"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="input-cadastro">
                <label for="senhaCadastro">Senha</label>
                <input
                    type="password"
                    id="senhaCadastro"
                    placeholder="Crie uma senha"
                    required
                >
            </div>

            <div class="input-cadastro">
                <label for="confirmarSenha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirme sua senha"
                    required
                >
            </div>

            <button type="submit">Cadastrar</button>

            <p id="mensagemCadastro" role="status"></p>

            <div class="register-link">
                <p>Já tem uma conta? <a href="login.html">Login</a></p>
            </div>

        </form>
    </main>
</body>
</html>
